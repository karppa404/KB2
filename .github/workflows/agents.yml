name: Agent trading package
on:
  pull_request:
    paths: ['agent/**', '.github/workflows/agents.yml']
  push:
    branches: [main]
    paths: ['agent/**', '.github/workflows/agents.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run python:setup
      - run: bun run typecheck
      - run: bun run test
